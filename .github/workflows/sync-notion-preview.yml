name: Sync Notion and audit

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"
  push:
    branches:
      - agent/test-notion-connection
    paths:
      - ".github/workflows/sync-notion-preview.yml"
      - "config/notion-sources.json"
      - "scripts/sync-notion.mjs"
      - "scripts/audit-generated-data.mjs"
      - "index.html"

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-preview:
    name: Build and audit public Hub data
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Read connected Notion databases
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
        run: node scripts/sync-notion.mjs

      - name: Audit generated data
        run: node scripts/audit-generated-data.mjs

      - name: Create PR with refreshed data
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "sync public Notion data"
          committer: "knowledge-hub-bot <knowledge-hub-bot@users.noreply.github.com>"
          branch: auto/sync-notion
          title: "sync: actualizar datos de Notion"
          body: "Datos públicos actualizados desde Notion (sync automático)."
          add-paths: |
            data/content.json
            data/investigations.json
